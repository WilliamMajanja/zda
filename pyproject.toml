[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zda"
version = "0.1.0"
description = "Zero-Dep Anything: statically identify and inspect 20+ binary formats with a Python stdlib-only CLI and MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZDA contributors" }]
keywords = ["reverse-engineering", "static-analysis", "cli", "mcp", "binary-analysis", "elf", "pe", "mach-o", "gguf", "wasm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/zda/zda"

[project.scripts]
zda = "zda.cli:main"

[tool.setuptools.packages.find]
include = ["zda*"]
